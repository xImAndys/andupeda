<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klarna AI Assistant — Slideshow</title>
    <script src="vendor/hyperframes-player.global.js"></script>
    <script src="vendor/hyperframes-slideshow.global.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #16181d; }
    </style>
  </head>
  <body>
    <!-- tabindex="0" lets the slideshow receive arrow keys. -->
    <hyperframes-slideshow tabindex="0" style="display: block; position: relative; width: 100vw; height: 100vh">
      <hyperframes-player interactive style="position: absolute; inset: 0" src="composition/index.html"></hyperframes-player>
      <!-- Copy of the island in composition/index.html (generated by build/build.mjs). -->
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "klarna-ai-assistant-title",
      "notes": "Introduce Klarna: Swedish fintech, buy-now-pay-later. The assistant lives inside the Klarna app. References are on the slide."
    },
    {
      "sceneId": "klarna-ai-assistant-summary",
      "notes": "Lead with the two-thirds number. Then who uses it, what it does, and the four headline metrics from Klarna's press release."
    },
    {
      "sceneId": "klarna-ai-assistant-diagram",
      "notes": "Walk left to right: context load, LLM router, specialist prompt plus tools, reply. Point out the human handoff and the LangSmith evaluation loop."
    },
    {
      "sceneId": "klarna-ai-assistant-prompts",
      "notes": "These are our guesses. The router returns structured JSON. The specialist gets only the customer's own data and is told never to invent numbers."
    },
    {
      "sceneId": "klarna-ai-assistant-screenshots",
      "notes": "Real product UI. Left: Klarna’s launch image. Middle: an answer grounded in the shopper’s own order. Right: the handoff to a human agent."
    }
  ],
  "slideSequences": []
}
      </script>
    </hyperframes-slideshow>
    <script>
      document.querySelector("hyperframes-slideshow").focus();
    </script>
  </body>
</html>
