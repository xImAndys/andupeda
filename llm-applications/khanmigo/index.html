<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khanmigo — Slideshow</title>
    <script src="vendor/hyperframes-player.global.js"></script>
    <script src="vendor/hyperframes-slideshow.global.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #16181d; }
    </style>
  </head>
  <body>
    <!-- tabindex="0" lets the slideshow receive arrow keys. -->
    <hyperframes-slideshow tabindex="0" style="display: block; position: relative; width: 100vw; height: 100vh">
      <hyperframes-player interactive style="position: absolute; inset: 0" src="composition/index.html"></hyperframes-player>
      <!-- Copy of the island in composition/index.html (generated by build/build.mjs). -->
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "khanmigo-title",
      "notes": "Introduce Khan Academy and Khanmigo. It is a nonprofit, and it was a GPT-4 launch partner. References are on the slide."
    },
    {
      "sceneId": "khanmigo-summary",
      "notes": "Lead with the Socratic idea: it never just gives the answer. Then the teacher side, pricing, and safety moderation."
    },
    {
      "sceneId": "khanmigo-diagram",
      "notes": "Walk through the loop: context, moderation, work check, Socratic reply, student retries. Moderation flags go to the parent or teacher."
    },
    {
      "sceneId": "khanmigo-prompts",
      "notes": "These are our guesses, based on Khan's published prompt-engineering principles: meet students where they are, use their interests, give immediate feedback, ask for self-explanation."
    },
    {
      "sceneId": "khanmigo-screenshots",
      "notes": "Show the real UI: exercise and tutor chat side by side."
    }
  ],
  "slideSequences": []
}
      </script>
    </hyperframes-slideshow>
    <script>
      document.querySelector("hyperframes-slideshow").focus();
    </script>
  </body>
</html>
