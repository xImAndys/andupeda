<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abridge — Slideshow</title>
    <script src="vendor/hyperframes-player.global.js"></script>
    <script src="vendor/hyperframes-slideshow.global.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #16181d; }
    </style>
  </head>
  <body>
    <!-- tabindex="0" lets the slideshow receive arrow keys. -->
    <hyperframes-slideshow tabindex="0" style="display: block; position: relative; width: 100vw; height: 100vh">
      <hyperframes-player interactive style="position: absolute; inset: 0" src="composition/index.html"></hyperframes-player>
      <!-- Copy of the island in composition/index.html (generated by build/build.mjs). -->
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "abridge-title",
      "notes": "Introduce Abridge: healthcare AI, ambient documentation, used inside Epic. References are on the slide."
    },
    {
      "sceneId": "abridge-summary",
      "notes": "Lead with the problem: documentation burden. Abridge drafts the note during the visit. Linked Evidence is the trust feature."
    },
    {
      "sceneId": "abridge-diagram",
      "notes": "Walk the pipeline: record, speech-to-text, EHR context, LLM draft, Linked Evidence, human review and signature. Codes and orders come from the Contextual Reasoning Engine."
    },
    {
      "sceneId": "abridge-prompts",
      "notes": "These are our guesses. The key constraint is grounding: only facts from the visit, a citation per sentence, and placeholders instead of guesses."
    },
    {
      "sceneId": "abridge-screenshots",
      "notes": "Real product UI. Recording in Epic Haiku on a phone, then the draft note in Epic with Linked Evidence next to the transcript."
    }
  ],
  "slideSequences": []
}
      </script>
    </hyperframes-slideshow>
    <script>
      document.querySelector("hyperframes-slideshow").focus();
    </script>
  </body>
</html>
